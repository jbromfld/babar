[project]
name = "babar"
version = "0.3.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.10,<3",
    "sentence-transformers",
    "torch==2.14.1",
    "mcp>=1.26,<2",
]

[project.scripts]
babar-memory = "memora.server:main"
babar-setup = "memora.setup:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17.4"]

[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memora*"]
namespaces = true

[tool.setuptools.package-data]
memora = ["schema.sql"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# ARM64 PyPI torch releases can include CUDA; this environment is CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
